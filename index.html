<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامه‌ریز کارها</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            width: 90%;
            max-width: 400px;
        }
        h1 { color: #00ff88; text-align: center; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background-color: #444;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00ff88;
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
        }
        ul { list-style: none; padding: 0; }
        li {
            background-color: #444;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            width: auto;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>کارهای من</h1>
    <input type="text" id="taskInput" placeholder="کار جدید رو بنویس...">
    <button onclick="addTask()">اضافه کردن</button>
    <ul id="taskList"></ul>
</div>

<script>
    function addTask() {
        const input = document.getElementById('taskInput');
        const taskText = input.value;
        if (taskText === '') return;

        const li = document.createElement('li');
        li.innerHTML = `
            <span>${taskText}</span>
            <button class="delete-btn" onclick="this.parentElement.remove()">حذف</button>
        `;
        
        document.getElementById('taskList').appendChild(li);
        input.value = '';
    }
</script>

</body>
</html>
