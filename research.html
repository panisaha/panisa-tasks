<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Notes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f0c29;
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { background: linear-gradient(45deg, #00ccff, #3333ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; font-size: 2rem; margin-bottom: 20px; }
        textarea {
            width: 100%; min-height: 200px; padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px;
            background-color: rgba(0, 0, 0, 0.3); color: white; font-size: 1rem;
            resize: vertical; outline: none; margin-bottom: 15px;
        }
        textarea:focus { border-color: #00ccff; }
        .upload-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: linear-gradient(45deg, #00ccff, #3333ff); color: white;
            padding: 12px 20px; border-radius: 12px; cursor: pointer; font-weight: bold;
        }
        input[type="file"] { display: none; }
        .image-preview { margin-top: 20px; display: none; }
        .image-preview img { width: 100%; border-radius: 12px; border: 2px solid rgba(255,255,255,0.2); }
        .back-btn {
            display: block; text-align: center; margin-top: 25px;
            color: #aaa; text-decoration: none; transition: color 0.3s;
        }
        .back-btn:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fa-solid fa-book-open"></i> Research Notes</h1>
        <textarea placeholder="Write your research here..."></textarea>
        
        <input type="file" id="imageUpload" accept="image/*" onchange="previewImage(event)">
        <label for="imageUpload" class="upload-btn">
            <i class="fa-solid fa-image"></i> Upload Image
        </label>
        
        <div class="image-preview" id="imagePreviewContainer">
            <img id="imagePreview" src="" alt="Uploaded Image">
        </div>

        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Tasks</a>
    </div>

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('imagePreview');
                output.src = reader.result;
                document.getElementById('imagePreviewContainer').style.display = 'block';
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</body>
</html>
