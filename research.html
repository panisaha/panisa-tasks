<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Notes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0a0f1c;
            background: linear-gradient(135deg, #0a0f1c, #101c2e);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #121a29;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            border: 1px solid #1f2f4a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        h1 {
            background: linear-gradient(45deg, #00ccff, #3333ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 800;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 1px solid #2a3b5c;
            border-radius: 12px;
            background-color: #0b111a;
            color: #e0e0e0;
            font-size: 1rem;
            resize: vertical;
            outline: none;
            margin-bottom: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        textarea:focus {
            border-color: #00ccff;
            box-shadow: 0 0 10px rgba(0, 204, 255, 0.2);
        }
        .upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(45deg, #00ccff, #3333ff);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
            border: none;
        }
        .upload-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        input[type="file"] {
            display: none;
        }
        .image-preview {
            margin-top: 20px;
            display: none;
        }
        .image-preview img {
            width: 100%;
            border-radius: 12px;
            border: 2px solid #1f2f4a;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #6a8caf;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        .back-btn:hover {
            color: #00ccff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fa-solid fa-book-open"></i> Research Notes</h1>
        
        <textarea placeholder="Write your research here..."></textarea>
        
        <input type="file" id="imageUpload" accept="image/*" onchange="previewImage(event)">
        <label for="imageUpload" class="upload-btn">
            <i class="fa-solid fa-image"></i> Upload Image
        </label>
        
        <div class="image-preview" id="imagePreviewContainer">
            <img id="imagePreview" src="" alt="Uploaded Image">
        </div>

        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Tasks</a>
    </div>

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('imagePreview');
                output.src = reader.result;
                document.getElementById('imagePreviewContainer').style.display = 'block';
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</body>
</html>
